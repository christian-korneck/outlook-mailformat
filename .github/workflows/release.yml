name: Release

on:
  push:
    tags: ['v*']            # e.g. v1.0.0; a suffix like v1.1.0-rc1 makes a pre-release

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ github.ref_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" dist/*.zip --repo "$GITHUB_REPOSITORY" \
            --title "mailformat $TAG" --generate-notes "${flags[@]}"
